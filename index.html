<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="FoodOrder - Complete Online Food Ordering and Delivery System. Order artisan pizzas, burgers, sushi, ramen, salads, desserts, and beverages with instant simulated tracking.">
  <meta name="theme-color" content="#F59E0B">
  
  <title>FoodOrder — Online Food Ordering & Delivery</title>

  <!-- Google Fonts: Plus Jakarta Sans for appetizing modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Favicon Emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
</head>
<body>
  <div id="app-root">
    <!-- Top Navigation Bar Mount -->
    <div id="navbar-mount"></div>

    <!-- Main View Mount (Dynamically swapped by Router) -->
    <main class="main-content" id="main-view" role="main">
      <!-- Loading Skeleton Placeholder -->
      <div class="container" style="padding: 3rem 1rem;">
        <div class="skeleton skeleton-title" style="width: 40%; height: 36px;"></div>
        <div class="skeleton skeleton-text" style="width: 60%; height: 20px; margin-bottom: 2rem;"></div>
        <div class="skeleton skeleton-img" style="height: 300px; margin-bottom: 2rem;"></div>
      </div>
    </main>

    <!-- Mobile Bottom Navigation Mount -->
    <div id="bottom-nav-mount"></div>

    <!-- Footer Mount -->
    <div id="footer-mount"></div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Application Bootstrap (Native ES6 Modules) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
